[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper-agent"
version = "0.1.0"
description = "Lightweight provider-neutral agent foundation"
requires-python = ">=3.11,<3.12"
dependencies = ["PyYAML>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["PySide6>=6.8,<7"]
semantic = ["fastembed>=0.9,<0.10"]

[project.scripts]
newspaper-agent = "newspaper_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_cache/tmp"
pythonpath = ["src"]
testpaths = ["tests"]
